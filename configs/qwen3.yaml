distributed:
    tp_size: 2
    cp_size: 1
    pp_size: 1
    dp_size: 1
    pp_engine: "1f1b"

model:
    name: "qwen3"
    tokenizer: "tokenizer_gpt2_2000"
    # 这里保留最小 Qwen3-like 结构：RMSNorm + RoPE + GQA + SwiGLU
    attention_backend: "sdpa"
    activation_checkpointing: false
    dropout: 0.0
    vocab_size: 2000
    block_size: 32
    embed_dim: 8
    num_heads: 4
    num_key_value_heads: 2
    intermediate_size: 32
    num_layers: 4
    rms_norm_eps: 0.000001
    rope_theta: 1000000.0

training:
    seed: 42
    learning_rate: 0.0003
    total_train_steps: 20000
    micro_batch_size: 4
    gradient_accumulation_steps: 2
    num_samples: 400000
    max_tokens: null
    use_fused_adam: false
    use_autocast: false
    use_torch_compile: false
    torch_compile_mode: "reduce-overhead"

dataset:
    loader: "random"
    name: "roneneldan/TinyStories"
    subset_name: null
    num_workers: 0
    num_proc: 4

checkpoint:
    save_dir: "tmp/qwen3"
    save_frequency: 300
    load_path: ""

logging:
    use_wandb: false
    project_name: "multigpt"
    run_name: "multigpt-qwen3"

profiling:
    enabled: false
    output_dir: "tmp/profiler"
    wait: 1
    warmup: 1
    active: 2
    repeat: 1
    record_shapes: true
    profile_memory: true
    with_stack: false

environment:
    OMP_NUM_THREADS: "1"
    TOKENIZERS_PARALLELISM: "false"
